<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="cause.css">
    
</head>
<body>
    <div class="custom-cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
    </div>
    
    <div class="container">
        <h1>Happy Birthday Jennifer💗</h1>
        <p style="font-size: 1.5rem; color: #666; margin: 2rem 0;">Hey You Know What! You're the most</p>
        <button class="shuffle-button" style="margin-top: 2rem;">Click to Enter Our World 💕</button>
    </div>

    <script>
        // Create floating elements function
        function createFloatingElement() {
            const elements = ['🌸', '✨', '💖', '🦋', '⭐'];
            const element = document.createElement('div');
            element.className = 'floating';
            element.textContent = elements[Math.floor(Math.random() * elements.length)];
            element.style.left = Math.random() * window.innerWidth + 'px';
            element.style.top = Math.random() * window.innerHeight + 'px';
            element.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(element);

            gsap.to(element, {
                y: -500,
                duration: Math.random() * 10 + 10,
                opacity: 0,
                onComplete: () => element.remove()
            });
        }

        // Custom cursor
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, {
                x: e.clientX - 15,
                y: e.clientY - 15,
                duration: 0.2
            });
        });

        // Handle button click to navigate to cause.html
        const shuffleButton = document.querySelector('.shuffle-button');
        shuffleButton.addEventListener('click', () => {
            gsap.to(shuffleButton, {
                scale: 0.9,
                duration: 0.1,
                yoyo: true,
                repeat: 1
            });
            // Navigate to cause.html
            gsap.to('body', {
                opacity: 0,
                duration: 0.5,
                onComplete: () => {
                    window.location.href = 'cause.html';
                }
            });
        });
        
        // Create initial floating elements
        setInterval(createFloatingElement, 2000);
    </script>
</body>
</html>
